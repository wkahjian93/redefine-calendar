<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REDEFINE Calendar</title>
<meta name="description" content="One calendar for the whole REDEFINE team: see everyone's work, keep private things private, and count activities automatically.">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REDEFINE Cal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* shown before anything else loads, so opening the app is never a dark or empty screen */
  html, body { background: #F4F5F9; margin: 0; }
  .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 600 14px -apple-system, "Segoe UI", Roboto, sans-serif; color: #6B7280; }
  .boot img { width: 168px; height: auto; }
  .boot i { width: 26px; height: 26px; border: 3px solid #E5E7EB; border-top-color: #E8505B; border-radius: 50%; animation: bootspin .8s linear infinite; }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: dark) { html, body { background: #0F1320; } .boot { color: #9AA3B5; } .boot i { border-color: #2A3148; border-top-color: #E8505B; } }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scroll"><div id="app"><div class="boot"><img src="icons/redefine-logo.png" alt="REDEFINE"><i></i></div></div></div>
<div id="banner" role="status" aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
